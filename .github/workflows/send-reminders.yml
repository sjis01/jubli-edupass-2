name: Send visitor pass reminder emails

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes, all day, every day
  workflow_dispatch:         # lets you trigger it manually, optionally with a fake date/time
    inputs:
      test_date:
        description: "Simulate this date (YYYY-MM-DD). Leave blank for real runs."
        required: false
      test_time:
        description: "Simulate this time, 24h (HH:MM). Leave blank for real runs."
        required: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
        working-directory: .

      - run: node send-reminders.js
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          TEST_DATE: ${{ github.event.inputs.test_date }}
          TEST_TIME: ${{ github.event.inputs.test_time }}
